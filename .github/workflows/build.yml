name: Build README Stats

# 1. When should this run?
on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 0 * * *" # Runs automatically at Midnight UTC
  workflow_dispatch:    # Allows manual triggering

# 2. Give the action permission to push files back
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' 
          # We must tell the cache exactly where to find your requirements file!
          cache-dependency-path: 'cache/requirements.txt'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pointing pip to the 'cache' folder
          pip install -r cache/requirements.txt

      - name: 🚀 Run Python Script
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py

      - name: 💾 Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add *.svg loc_cache.json
          
          # Commit only if changes were made
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update dynamic GitHub stats" && git push)
